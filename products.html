<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Rapti Nursery – Products</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="shop.css"></head><body>
<header><a href="index.html" class="logo">Rapti Nursery</a><div class="hamburger"><span></span><span></span><span></span></div><nav><ul>
<li><a href="index.html">Home</a></li><li><a href="products.html">Products</a></li><li><a href="services.html">Decoration Services</a></li><li><a href="gallery.html">Gallery</a></li><li><a href="reviews.html">Reviews</a></li><li><a href="about.html">About</a></li></ul></nav></header>
<main><section class="page-hero"><h1>Products</h1></section><div class="shop-wrap"><input id="q" class="search" placeholder="Search plants…"><div class="chips" id="chips"></div><div class="product-grid" id="grid"><p>Loading plants…</p></div></div></main>
<footer><p>© 2025 Rapti Nursery. All rights reserved.</p></footer>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="shop.js"></script><script>const h=document.querySelector('.hamburger'),n=document.querySelector('nav');h.onclick=()=>{h.classList.toggle('active');n.classList.toggle('active')}</script>
<script>
let all=[],cat='All';
function draw(){const q=document.getElementById('q').value.toLowerCase();
 const l=all.filter(p=>(cat==='All'||p.category===cat)&&p.name.toLowerCase().includes(q));
 document.getElementById('grid').innerHTML=l.length?l.map(p=>Shop.card(p)).join(''):'<p>No plants found.</p>'}
Shop.list().then(l=>{all=l;const cs=['All',...new Set(l.map(p=>p.category))];
 const ch=document.getElementById('chips');ch.innerHTML=cs.map(c=>`<button class="chip${c==='All'?' on':''}">${esc(c)}</button>`).join('');
 ch.onclick=e=>{if(e.target.tagName!=='BUTTON')return;cat=e.target.textContent;[...ch.children].forEach(b=>b.classList.toggle('on',b===e.target));draw()};draw()});
document.getElementById('q').oninput=draw;</script></body></html>
